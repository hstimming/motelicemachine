/* Layout: a portrait security monitor in the poster's own frame, a console of controls under it,
   and a guest registration card that rises out of the ice machine. One dark look, by design. */
:root {
  --black: #000;
  --paper: #ecebe4;      /* card stock; HUD and subtitle text */
  --ink: #1d1d1b;        /* dot-matrix ink on the card */
  --orange: #cf4b21;     /* logo orange, read from the band's poster file */
  --orange-ink: #b23a12; /* small orange print on the card (5:1 on paper) */
  --steel: #8b9295;      /* quiet lines and secondary text on black */
  --frost: #d7e6eb;      /* cold light from the open freezer */
  --font-display: "Poster Title", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-hud: "VT323", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--black);
  color: var(--paper);
  font: 16px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.sr-only {
  position: absolute !important;
  width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
  white-space: nowrap; border: 0;
}

/* ---------- Console ---------- */
.console {
  height: 100%;
  display: flex;
  flex-direction: column;
  width: 100%;
  margin-inline: auto;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (min-width: 600px) {
  .console {
    width: min(100%, max(380px, calc((100vh - 126px) * 0.6041)));
    width: min(100%, max(380px, calc((100dvh - 126px) * 0.6041)));
    padding-top: max(16px, env(safe-area-inset-top, 0px));
  }
  .scene { border: 1px solid #262626; border-radius: 4px; }
}

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ---------- The monitor ---------- */
.scene {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: var(--black);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.is-open .scene { cursor: default; }
.bob { position: absolute; inset: 0; }
.walking .bob { animation: bob 1.25s ease-in-out; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  22% { transform: translateY(-3px); }
  46% { transform: translateY(1px); }
  70% { transform: translateY(-2px); }
}

/* The world is the photo's own pixel grid (386 x 639). The script moves the camera over it. */
.world {
  position: absolute;
  left: 0;
  top: 0;
  width: 386px;
  height: 639px;
  transform-origin: 0 0;
  transition: transform 1.25s cubic-bezier(.42, .08, .22, 1);
}
.world img { display: block; max-width: none; }
.world::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(to bottom, var(--black), rgba(0, 0, 0, 0) 22px, rgba(0, 0, 0, 0) calc(100% - 30px), var(--black)),
    linear-gradient(to right, var(--black), rgba(0, 0, 0, 0) 10px, rgba(0, 0, 0, 0) calc(100% - 10px), var(--black));
}
.photo {
  position: absolute;
  left: 0;
  top: 0;
  width: 386px;
  height: 639px;
  -webkit-user-drag: none;
}

/* Inside the ice machine */
.interior {
  position: absolute;
  left: 176px;
  top: 487px;
  width: 91px;
  height: 88px;
  clip-path: polygon(0 0, 100% 0, 100% 92.05%, 0 100%);
  background:
    radial-gradient(ellipse 90% 60% at 50% -8%, rgba(215, 230, 235, .75), rgba(215, 230, 235, 0) 72%),
    linear-gradient(#151b1d, #050607 80%);
}
.interior::before {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 2px rgba(215, 230, 235, .22), inset 0 0 16px rgba(0, 0, 0, .9);
}
.bag {
  position: absolute;
  bottom: 6px;
  width: 27px;
  height: 24px;
  border-radius: 8px 8px 4px 4px;
  background: linear-gradient(rgba(234, 241, 243, .8), rgba(150, 164, 169, .6));
}
.bag::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -5px;
  width: 8px;
  height: 7px;
  margin-left: -4px;
  border-radius: 3px 3px 1px 1px;
  background: rgba(205, 216, 220, .75);
}
.bag-1 { left: 5px; }
.bag-2 { left: 32px; bottom: 9px; height: 27px; }
.bag-3 { left: 59px; bottom: 9px; }
.mini-card {
  position: absolute;
  left: 29px;
  top: 30px;
  width: 33px;
  height: 22px;
  background: var(--paper);
  border-top: 3px solid var(--orange);
  transform: rotate(-9deg);
  box-shadow: 0 2px 5px rgba(0, 0, 0, .7);
  transition: opacity .2s;
}
.is-revealed .mini-card { opacity: 0; }

/* The door: a cut-out of the photo that swings open on its right-hand hinge */
.door-frame {
  position: absolute;
  left: 176px;
  top: 487px;
  width: 91px;
  height: 88px;
  perspective: 420px;
  perspective-origin: -40% 45%;
}
.door {
  position: absolute;
  inset: 0;
  transform-origin: 100% 50%;
  transform-style: preserve-3d;
  transition: transform 1.3s cubic-bezier(.33, .02, .18, 1);
}
.is-open .door { transform: rotateY(106deg); }
.door-face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.door-front { clip-path: polygon(0 0, 100% 0, 100% 92.05%, 0 100%); }
.door-front img {
  position: absolute;
  left: -176px;
  top: -487px;
  width: 386px;
  height: 639px;
}
.door-back {
  transform: rotateY(180deg);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 92.05%);
  background: linear-gradient(90deg, #2a2e2f, #575e60 42%, #3a3f41);
  box-shadow: inset 0 0 0 3px #17191a, inset 0 0 0 5px #7d8689;
}
.door-glow {
  position: absolute;
  left: 138px;
  top: 438px;
  width: 168px;
  height: 196px;
  pointer-events: none;
  background: radial-gradient(ellipse 46% 40% at 50% 52%, rgba(215, 230, 235, .5), rgba(215, 230, 235, 0) 72%);
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity 1.6s ease .3s;
}
.is-open .door-glow { opacity: 1; }

/* The breezeway bulb: a slow, shallow flicker */
.bulb {
  position: absolute;
  left: 283px;
  top: 237px;
  width: 104px;
  height: 104px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255, 247, 228, .5), rgba(255, 247, 228, .12) 40%, rgba(255, 247, 228, 0) 68%);
  mix-blend-mode: screen;
  animation: bulb 6.5s ease-in-out infinite;
}
@keyframes bulb {
  0%, 100% { opacity: .95; }
  17% { opacity: .78; }
  21% { opacity: .95; }
  54% { opacity: .85; }
  58% { opacity: 1; }
}

/* Cold fog: puffs that spill from the door and sink onto the concrete */
.fog {
  position: absolute;
  left: 120px;
  top: 470px;
  width: 200px;
  height: 169px;
  pointer-events: none;
}
.floor-fog {
  position: absolute;
  left: 6px;
  top: 110px;
  width: 188px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(233, 240, 242, .55), rgba(233, 240, 242, 0));
  opacity: 0;
  transform: scaleX(.3);
  transition: opacity 1.8s ease .5s, transform 3.5s cubic-bezier(.2, .7, .2, 1) .4s;
}
.is-open .floor-fog { opacity: .9; transform: scaleX(1); }
/* the sheet of cold air pouring over the freezer's lip */
.spill {
  position: absolute;
  left: 52px;
  top: 78px;
  width: 99px;
  height: 62px;
  transform-origin: 50% 0;
  border-radius: 45% 45% 50% 50% / 30% 30% 70% 70%;
  background: linear-gradient(to bottom, rgba(236, 243, 245, 0), rgba(236, 243, 245, .8) 32%, rgba(236, 243, 245, .5) 72%, rgba(236, 243, 245, 0));
  filter: blur(2.5px);
  opacity: 0;
  transform: scaleY(0);
  transition: opacity .9s ease .35s, transform 1.4s cubic-bezier(.2, .7, .2, 1) .35s;
}
.is-open .spill {
  opacity: .95;
  transform: scaleY(1);
  animation: breathe 4.5s ease-in-out 1.8s infinite;
}
@keyframes breathe {
  0%, 100% { opacity: .95; transform: scaleY(1) scaleX(1); }
  50% { opacity: .78; transform: scaleY(1.08) scaleX(1.05); }
}
/* fog settling inside the freezer, around the ice bags */
.mist {
  position: absolute;
  left: -6px;
  right: -6px;
  bottom: -4px;
  height: 50%;
  background: radial-gradient(ellipse 62% 72% at 50% 100%, rgba(236, 243, 245, .8), rgba(236, 243, 245, 0) 72%);
  filter: blur(1.5px);
  opacity: 0;
  transition: opacity 1s ease .2s;
}
.is-open .mist { opacity: 1; }
.puff {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--w);
  height: calc(var(--w) * .62);
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(236, 243, 245, .82), rgba(236, 243, 245, .3) 55%, rgba(236, 243, 245, 0));
  opacity: 0;
  transform: translate(-50%, -50%) scale(.3);
}
.is-open .puff { animation: spill var(--dur) cubic-bezier(.25, .6, .35, 1) var(--delay) infinite both; }
@keyframes spill {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
  18% { opacity: var(--peak); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--s)); }
}
.p1 { --x: 101px; --y: 92px; --w: 62px; --dx: -55px; --dy: 40px; --s: 2.2; --peak: .95; --dur: 5.6s; --delay: .3s; }
.p2 { --x: 101px; --y: 92px; --w: 62px; --dx: 60px; --dy: 42px; --s: 2.3; --peak: .95; --dur: 6.2s; --delay: .45s; }
.p3 { --x: 85px; --y: 86px; --w: 48px; --dx: -25px; --dy: 56px; --s: 2; --peak: .9; --dur: 5.2s; --delay: .6s; }

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  try {
    start();
  } catch (err) {
    // If anything goes wrong, fall back to the plain page: poster, then the card.
    root.classList.remove('js');
    if (window.console && console.error) console.error(err);
  }

  function start() {
    const $ = (id) => document.getElementById(id);
    const stage = $('stage');
    const scene = $('scene');
    const world = $('world');
    const announcer = $('announcer');
    const back = $('back');
    const forward = $('forward');
    const forwardLabel = $('forward-label');
    const invite = $('tickets');
    const card = $('invite-card');
    const title = $('invite-title');
    const restart = $('restart');
    const clock = $('clock');
    const grain = $('grain');
    const slot = $('ticket-slot');
    const note = $('ticket-note');

    const IMG = { w: 386, h: 639 };              // the photo's own pixel grid
    const DOOR = { x: 176, y: 487, w: 91, h: 88 }; // the ICE door, measured on the photo
    const LAST = 2;                               // the step where the door can be opened
    const SHOTS = [
      { region: null,
        line: 'Blueberry Hill. Dec 7, 9 PM. Your invitation is in the ice machine.' },
      { region: { x: 88, y: 268, w: 284, h: 344 },
        line: 'You cross the lot. The ice machine hums under the light.' },
      { region: { x: 118, y: 370, w: 184, h: 232 },
        line: 'You reach the ice machine. Cold air leaks around the door.' },
      { region: { x: 146, y: 438, w: 150, h: 176 },
        line: 'The door swings open. Cold fog spills out. Your invitation is inside.' }
    ];

    let step = 0;
    let isOpen = false;
    let revealTimer = 0;
    let walkTimer = 0;
    let clockTimer = 0;
    const loadedAt = Date.now();
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    /* ---------- Motion: follows the device's "reduce motion" setting ---------- */
    const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    const reduced = () => !!(mq && mq.matches);

    function applyMotion() {
      root.classList.toggle('reduce-motion', reduced());
      startClock();
    }
    if (mq) {
      if (mq.addEventListener) mq.addEventListener('change', applyMotion);
      else if (mq.addListener) mq.addListener(applyMotion);
    }

    /* ---------- Security-camera clock: starts at showtime, 21:00:00 ---------- */
    function renderClock() {
      const sec = reduced() ? 0 : Math.floor((Date.now() - loadedAt) / 1000);
      const t = 21 * 3600 + sec;
      const two = (n) => String(n).padStart(2, '0');
      clock.textContent = two(Math.floor(t / 3600) % 24) + ':' + two(Math.floor(t / 60) % 60) + ':' + two(t % 60);
    }
    function startClock() {
      clearInterval(clockTimer);
      renderClock();
      if (!reduced()) clockTimer = setInterval(renderClock, 1000);
    }

    /* ---------- Film grain, drawn once ---------- */
    function makeGrain() {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        const ctx = c.getContext('2d');
        const img = ctx.createImageData(128, 128);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = (Math.random() * 256) | 0;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        const url = 'url("' + c.toDataURL('image/png') + '")';
        grain.style.backgroundImage = url;
        card.style.setProperty('--paper-grain', url);
      } catch (e) { /* no grain; the page still works */ }
    }

    /* ---------- Camera ---------- */
    function camera(i) {
      const sw = scene.clientWidth;
      const sh = scene.clientHeight;
      const r = SHOTS[i].region;
      let s, tx, ty;
      if (!r) {
        // The whole poster, as wide as the screen allows; trim only the floor if it must.
        s = Math.min(sw / IMG.w, (sh * 1.1) / IMG.h);
        tx = (sw - IMG.w * s) / 2;
        ty = IMG.h * s > sh ? 0 : (sh - IMG.h * s) / 2;
      } else {
        s = Math.max(Math.min((sw * 0.94) / r.w, (sh * 0.94) / r.h), Math.max(sw / IMG.w, sh / IMG.h));
        tx = clamp(sw / 2 - (r.x + r.w / 2) * s, sw - IMG.w * s, 0);
        ty = clamp(sh / 2 - (r.y + r.h / 2) * s, sh - IMG.h * s, 0);
      }
      return { s, tx, ty };
    }
    function placeCamera(instant) {
      const c = camera(isOpen ? 3 : step);
      if (instant) world.style.transition = 'none';
      world.style.transform = 'translate(' + c.tx.toFixed(2) + 'px, ' + c.ty.toFixed(2) + 'px) scale(' + c.s.toFixed(4) + ')';
      if (instant) {
        void world.offsetWidth;
        world.style.transition = '';
      }
    }

    /* ---------- Steps ---------- */
    function say(text) {
      announcer.textContent = text; // read aloud by screen readers only; nothing shows on screen
    }
    function syncStep() {
      scene.dataset.step = String(step);
      back.disabled = step === 0;
      const atDoor = step === LAST;
      forwardLabel.textContent = atDoor ? 'Open the door' : 'Walk closer';
      forward.dataset.mode = atDoor ? 'open' : 'walk';
    }
    function bob() {
      if (reduced()) return;
      clearTimeout(walkTimer);
      scene.classList.remove('walking');
      void scene.offsetWidth;
      scene.classList.add('walking');
      walkTimer = setTimeout(() => scene.classList.remove('walking'), 1300);
    }
    function go(next) {
      if (isOpen) return;
      next = clamp(next, 0, LAST);
      if (next === step) return;
      step = next;
      syncStep();
      bob();
      placeCamera(reduced());
      say(SHOTS[step].line);
    }

    function openDoor(instant) {
      if (isOpen) return;
      const quick = instant || reduced();
      isOpen = true;
      if (quick) stage.classList.add('no-anim');
      stage.classList.add('is-open');
      placeCamera(quick);
      say(SHOTS[3].line);
      clearTimeout(revealTimer);
      if (quick) {
        reveal(true);
        void stage.offsetWidth;
        requestAnimationFrame(() => stage.classList.remove('no-anim'));
      } else {
        revealTimer = setTimeout(() => reveal(false), 2300); // let the fog spill first
      }
    }

    function reveal(instant) {
      invite.classList.add('is-shown');
      stage.classList.add('is-revealed');
      if (!instant && !reduced() && card.animate) {
        // Lift the card out of the ice machine's doorway.
        const c = camera(3);
        const sr = scene.getBoundingClientRect();
        const fromX = sr.left + c.tx + (DOOR.x + DOOR.w / 2) * c.s;
        const fromY = sr.top + c.ty + (DOOR.y + DOOR.h / 2) * c.s;
        const rc = card.getBoundingClientRect();
        const dx = fromX - (rc.left + rc.width / 2);
        const dy = fromY - (rc.top + rc.height / 2);
        card.animate([
          { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(.12) rotate(-9deg)', opacity: 0 },
          { opacity: 1, offset: 0.35 },
          { transform: 'translate(0, 0) scale(1) rotate(-1.2deg)', opacity: 1 }
        ], { duration: 900, easing: 'cubic-bezier(.2, .75, .25, 1)' });
      }
      try { title.focus({ preventScroll: true }); } catch (e) { title.focus(); }
      try { history.replaceState(null, '', '#tickets'); } catch (e) { /* hash not updated; fine */ }
    }

    function goToTickets() {
      if (isOpen) {
        invite.classList.add('is-shown');
        title.focus();
        return;
      }
      clearTimeout(walkTimer);
      scene.classList.remove('walking');
      step = LAST;
      syncStep();
      openDoor(true);
    }

    function startOver() {
      clearTimeout(revealTimer);
      isOpen = false;
      invite.classList.remove('is-shown');
      stage.classList.remove('is-open', 'is-revealed');
      step = 0;
      syncStep();
      placeCamera(reduced());
      say(SHOTS[0].line);
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* fine */ }
      forward.focus();
    }

    /* ---------- Ticket link (set in ticket-link.js) ---------- */
    function setupTicket() {
      const raw = typeof window.MIM_TICKET_LINK === 'string' ? window.MIM_TICKET_LINK.trim() : '';
      // Only a real-looking Partiful event link turns the button on. Anything else, including
      // obvious placeholders like ".../e/PASTE-LINK-HERE" or the example in ticket-link.js, keeps it disabled.
      const match = raw.match(/^https:\/\/(?:www\.)?partiful\.com\/e\/([A-Za-z0-9_-]{6,64})\/?(?:\?[A-Za-z0-9_=&%.-]*)?$/);
      const id = match ? match[1] : '';
      const placeholder = /^(x+|0+|abc\w*|1234\w*)$/i.test(id) ||
        /(paste|link|here|example|sample|placeholder|your|event|todo|tbd|test)/i.test(id);
      if (!match || placeholder) return;
      const a = document.createElement('a');
      a.className = 'ticket-button';
      a.href = raw;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = 'Get tickets';
      slot.textContent = '';
      slot.appendChild(a);
    }

    /* ---------- Wiring ---------- */
    forward.addEventListener('click', () => (step < LAST ? go(step + 1) : openDoor(false)));
    back.addEventListener('click', () => go(step - 1));
    restart.addEventListener('click', startOver);
    scene.addEventListener('click', (e) => {
      if (isOpen || e.target.closest('a, button')) return;
      forward.click();
    });
    document.addEventListener('keydown', (e) => {
      if (isOpen || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        forward.click();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!back.disabled) back.click();
      }
    });
    window.addEventListener('hashchange', () => { if (location.hash === '#tickets') goToTickets(); });

    // Re-frame when the screen changes size (rotating a phone, fonts arriving).
    // During the first moment after load, snap instead of gliding.
    let resizeFrame = 0;
    let settled = false;
    setTimeout(() => { settled = true; }, 1200);
    const onResize = () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => placeCamera(!settled || reduced()));
    };
    if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(scene);
    else window.addEventListener('resize', onResize);

    makeGrain();
    applyMotion();
    setupTicket();
    syncStep();
    placeCamera(true);
    if (location.hash === '#tickets') goToTickets();
  }
})();
</script>

</body></html>
